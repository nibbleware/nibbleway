# Nibbleway System Definition (C4 Model)
# Standard: C4 Model (Context, Containers, Components)

version: "1.0"
system:
  name: "Customer Support System"
  description: "Automated support ticketing and billing."

# Level 2: Containers (Agents are Containers)
containers:
  - id: "triage-agent"
    name: "Triage Agent"
    type: "Agent"
    technology: "OpenAI GPT-4o"
    # Interface Definition (Standard OpenAPI)
    api_spec: "./specs/triage-agent-openapi.json" 

  - id: "billing-agent"
    name: "Billing Specialist"
    type: "Agent"
    technology: "Anthropic Claude 3.5"
    api_spec: "./specs/billing-agent-openapi.json"

  - id: "stripe-integration"
    name: "Stripe Tool Server"
    type: "MCP Server"
    technology: "Node.js"
    api_spec: "./specs/stripe-mcp-openapi.json"
    execution:
      type: "local"
      command: "npx"
      args: ["-y", "@modelcontextprotocol/server-stripe"]
      env:
        STRIPE_KEY: "${env.STRIPE_KEY}"

  - id: "push-service"
    name: "Enterprise Push"
    type: "Vendor Service"
    category: "Push Notifications"
    vendor: "Amazon SNS"
    technology: "AWS SDK"

# Level 2 Relations: Flows
relationships:
  - source: "triage-agent"
    destination: "billing-agent"
    description: "Hands off billing-related tickets"
    protocol: "Agent-to-Agent (MCP)"

  - source: "billing-agent"
    destination: "stripe-integration"
    description: "Refunds customers"
    protocol: "MCP Tool Call"

# Level 3: Rails (Policies defined via Standard Policy-as-Code, e.g., OPA/Rego)
policies:
  - id: "no-pii"
    format: "rego"
    source: "./policies/pii.rego"
